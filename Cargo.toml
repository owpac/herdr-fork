[package]
name = "herdr-fork"
# The release workflow writes the version (YYYY.M.N) in the commit of the tag.
version = "2026.11.3"
edition = "2021"
# The oldest toolchain that the cargo fallback of scripts/install.sh supports.
rust-version = "1.88"
description = "herdr plugin: fork the Claude Code or Codex session of a pane into a split or a tab"
license = "MIT"
repository = "https://github.com/owpac/herdr-fork"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
