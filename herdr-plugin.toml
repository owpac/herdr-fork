id = "herdr-fork"
name = "Fork"
# The version of a release: YYYY.M.N. The release workflow writes the version in the commit of
# the tag of each release, then pushes this commit to main.
version = "0.0.0"
min_herdr_version = "0.9.0"
description = "Fork the Claude Code or Codex session of the focused pane into a split or a tab"
platforms = ["linux", "macos"]

# scripts/install.sh puts the binary at bin/herdr-fork: the release binary of this version,
# or a cargo build.
[[build]]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "right"
title = "Fork the agent into a split on the right"
description = "Fork the Claude Code or Codex session of the focused pane into a new split on the right"
contexts = ["global"]
command = ["bin/herdr-fork", "right"]

[[actions]]
id = "down"
title = "Fork the agent into a split below"
description = "Fork the Claude Code or Codex session of the focused pane into a new split below"
contexts = ["global"]
command = ["bin/herdr-fork", "down"]

[[actions]]
id = "tab"
title = "Fork the agent into a new tab"
description = "Fork the Claude Code or Codex session of the focused pane into a new tab"
contexts = ["global"]
command = ["bin/herdr-fork", "tab"]

# A small popup with the message of a failed fork and an OK button. A herdr notification can stay
# hidden: with ui.toast.delivery = "terminal", herdr gives it to the terminal. As for an action,
# herdr finds bin/herdr-fork in the plugin root.
[[panes]]
id = "message"
title = "Fork"
placement = "popup"
width = 72
height = 14
command = ["bin/herdr-fork", "message"]
