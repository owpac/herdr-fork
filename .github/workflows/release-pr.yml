# Keep the pull request "chore: release YYYY.M.N" up to date, like the release of jdx/mise.
#
# scripts/release-pr.sh writes the next version and the section of CHANGELOG.md in the branch
# release, and opens or updates its pull request. The merge of this pull request puts the version
# on main: the marketplace of herdr.dev reads the version of main. Then the workflow release tags
# this commit of main, builds the binaries and publishes the release.
#
# The workflow runs after each push to main, and each day: in a new month, the open pull request
# gets the version of this month.
name: release-pr

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Push the branch release, open its pull request, and approve the runs of its checks.
      contents: write
      pull-requests: write
      actions: write
    steps:
      # fetch-depth 0 also fetches the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: git-cliff
      - name: Update the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/release-pr.sh
